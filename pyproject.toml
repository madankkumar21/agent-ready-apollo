[project]
name = "agent-ready-apollo"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "graphql-core>=3.3.1",
    "httpx>=0.28.1",
    "mcp>=1.0",
    "pyjwt>=2.15.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
