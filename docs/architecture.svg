<svg viewBox="0 0 1120 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="agent-ready-apollo architecture: an agent calls the Apollo MCP Server, which sends GraphQL with the agent's JWT to the GraphOS Router; the router checks the token and field scopes, plans the query and calls three REST services through Connectors. A human token can apply budget moves. Two baseline MCP servers call the REST services directly. CI composes the graph and checks the agent's operations.">
<style>
.bg{fill:var(--paper,#ffffff)}
.zone{fill:var(--zone,#f6f8fb);stroke:var(--zone-line,#b9c3d1);stroke-width:1.2;stroke-dasharray:6 4}
.box{fill:var(--paper,#ffffff);stroke:var(--ink,#141b26);stroke-width:1.5}
.soft{fill:var(--pill,#eaf0fb);stroke:var(--line,#d6dce5)}
.zt{fill:var(--muted,#5b6575);font:600 12px var(--mono,ui-monospace,Menlo,monospace);letter-spacing:.06em}
.t{fill:var(--ink,#141b26);font:600 14px var(--sans,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif)}
.s{fill:var(--muted,#5b6575);font:12.5px var(--sans,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif)}
.c{fill:var(--ink,#141b26);font:11.5px var(--mono,ui-monospace,Menlo,monospace)}
.flow{stroke:var(--work,#2f5bd3);stroke-width:2.2;fill:none}
.base{stroke:var(--plain,#7a8494);stroke-width:1.8;fill:none}
.cfg{stroke:var(--muted,#5b6575);stroke-width:1.4;fill:none;stroke-dasharray:4 4}
.stop{stroke:var(--fail,#c9581a);stroke-width:2.2;fill:none}
.appr{stroke:var(--appr,#16824f);stroke-width:2.2;fill:none}
.n{fill:var(--work,#2f5bd3)} .nt{fill:var(--paper,#ffffff);font:700 12px var(--mono,ui-monospace,Menlo,monospace)}
.red{fill:var(--fail,#c9581a)} .redt{fill:var(--fail,#c9581a);font:600 12px var(--sans,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif)}
.grn{fill:var(--appr,#16824f)} .grnt{fill:var(--appr,#16824f);font:600 12px var(--sans,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif)}
.ah{fill:var(--work,#2f5bd3)} .ahg{fill:var(--plain,#7a8494)} .ahk{fill:var(--muted,#5b6575)} .ahr{fill:var(--fail,#c9581a)} .aha{fill:var(--appr,#16824f)}
</style>
<defs>
<marker id="mb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" class="ah"/></marker>
<marker id="mg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="ahg"/></marker>
<marker id="mk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="ahk"/></marker>
<marker id="mr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="ahr"/></marker>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" class="aha"/></marker>
</defs>
<rect x="0" y="0" width="1120" height="640" class="bg"/>

<!-- zones, top row -->
<rect x="14" y="30" width="170" height="210" rx="10" class="zone"/><text x="26" y="50" class="zt">AGENT</text>
<rect x="200" y="30" width="230" height="210" rx="10" class="zone"/><text x="212" y="50" class="zt">APOLLO MCP SERVER 2.1.0</text>
<rect x="446" y="30" width="250" height="210" rx="10" class="zone"/><text x="458" y="50" class="zt">GRAPHOS ROUTER 2.18.0</text>
<rect x="712" y="30" width="170" height="210" rx="10" class="zone"/><text x="724" y="50" class="zt">CONNECTORS</text>
<rect x="898" y="30" width="208" height="210" rx="10" class="zone"/><text x="910" y="50" class="zt">REST SERVICES (MOCKS)</text>

<!-- agent -->
<rect x="28" y="70" width="142" height="86" rx="8" class="box"/>
<text x="40" y="94" class="t">Scripted agent</text>
<text x="40" y="114" class="c">agent/harness.py</text>
<text x="40" y="134" class="s">same task, 3 paths</text>
<text x="40" y="150" class="s">records what it got</text>

<!-- MCP -->
<rect x="214" y="64" width="202" height="98" rx="8" class="box"/>
<text x="226" y="86" class="t">Tools = operation files</text>
<text x="226" y="106" class="c">CampaignPerformance</text>
<text x="226" y="123" class="c">ProposeBudgetMove</text>
<text x="226" y="140" class="c">AccountOwner</text>
<text x="226" y="156" class="s">mcp/operations/*.graphql</text>
<rect x="214" y="172" width="202" height="56" rx="8" class="soft"/>
<text x="226" y="192" class="s">introspection, execute: off</text>
<text x="226" y="210" class="s">sends Bearer agent JWT</text>
<text x="226" y="224" class="c">mcp/config.yaml</text>

<!-- router -->
<rect x="460" y="64" width="222" height="44" rx="8" class="box"/><text x="472" y="84" class="t">Check JWT signature</text><text x="472" y="100" class="s">against the JWKS; read scopes</text>
<rect x="460" y="116" width="222" height="44" rx="8" class="box"/><text x="472" y="136" class="t">@requiresScopes per field</text><text x="472" y="152" class="s">contact fields need pii:read</text>
<rect x="460" y="168" width="222" height="60" rx="8" class="box"/><text x="472" y="188" class="t">Plan across subgraphs</text><text x="472" y="206" class="s">return only selected fields</text><text x="472" y="222" class="c">router/router.yaml</text>

<!-- connectors -->
<rect x="720" y="68" width="152" height="44" rx="8" class="box"/><text x="730" y="88" class="c">graph/ads.graphql</text><text x="730" y="104" class="s">campaigns, proposals</text>
<rect x="720" y="120" width="152" height="44" rx="8" class="box"/><text x="730" y="140" class="c">graph/media.graphql</text><text x="730" y="156" class="s">segments</text>
<rect x="720" y="172" width="152" height="44" rx="8" class="box"/><text x="730" y="192" class="c">graph/crm.graphql</text><text x="730" y="208" class="s">advertisers (PII)</text>
<text x="730" y="234" class="s">@source + @connect</text>

<!-- REST -->
<rect x="912" y="68" width="180" height="44" rx="8" class="box"/><text x="924" y="88" class="t">ads  :4102</text><text x="924" y="104" class="s">line items, budgets</text>
<rect x="912" y="120" width="180" height="44" rx="8" class="box"/><text x="924" y="140" class="t">media  :4101</text><text x="924" y="156" class="s">contextual segments</text>
<rect x="912" y="172" width="180" height="44" rx="8" class="box"/><text x="924" y="192" class="t">crm  :4103</text><text x="924" y="208" class="s">contact email, phone</text>
<text x="924" y="234" class="s">FastAPI, synthetic data</text>

<!-- main flow -->
<path d="M170 100 L210 100" class="flow" marker-end="url(#mb)"/>
<path d="M416 92 L456 86" class="flow" marker-end="url(#mb)"/>
<path d="M682 196 L716 142" class="flow" marker-end="url(#mb)"/>
<path d="M872 90 L908 90" class="flow" marker-end="url(#mb)"/><path d="M872 142 L908 142" class="flow" marker-end="url(#mb)"/><path d="M872 194 L908 194" class="flow" marker-end="url(#mb)"/>
<path d="M1000 250 L1000 262 L99 262 L99 160" class="flow" marker-end="url(#mb)"/>
<circle cx="190" cy="100" r="11" class="n"/><text x="190" y="104" text-anchor="middle" class="nt">1</text>
<circle cx="436" cy="89" r="11" class="n"/><text x="436" y="93" text-anchor="middle" class="nt">2</text>
<circle cx="452" cy="112" r="11" class="n"/><text x="452" y="116" text-anchor="middle" class="nt">3</text>
<circle cx="702" cy="168" r="11" class="n"/><text x="702" y="172" text-anchor="middle" class="nt">4</text>
<circle cx="888" cy="118" r="11" class="n"/><text x="888" y="122" text-anchor="middle" class="nt">5</text>
<circle cx="560" cy="262" r="11" class="n"/><text x="560" y="266" text-anchor="middle" class="nt">6</text>
<text x="716" y="284" class="s">only selected fields return: 860 chars for the task</text>

<!-- second row: identity, human, license, blocks -->
<rect x="446" y="300" width="250" height="70" rx="10" class="soft"/>
<text x="458" y="320" class="t">Local identity provider</text>
<text x="458" y="338" class="c">auth/tokens.py → JWKS</text>
<text x="458" y="356" class="s">agent: campaign:read proposal:write</text>
<path d="M571 300 L571 232" class="cfg" marker-end="url(#mk)"/>

<rect x="200" y="300" width="230" height="70" rx="10" class="box"/>
<text x="212" y="322" class="t">Human approver</text>
<text x="212" y="340" class="s">adds pii:read budget:write</text>
<text x="212" y="358" class="c">applyBudgetMove</text>
<path d="M430 320 L456 214" class="appr" marker-end="url(#ma)"/>
<text x="292" y="390" class="grnt">human: contact fields shown; apply → status: applied</text>

<rect x="712" y="300" width="170" height="70" rx="10" class="soft"/>
<text x="724" y="320" class="t">GraphOS (Free plan)</text>
<text x="724" y="338" class="s">license for JWT and</text>
<text x="724" y="354" class="s">@requiresScopes</text>
<path d="M712 318 L686 228" class="cfg" marker-end="url(#mk)"/>

<rect x="898" y="300" width="208" height="90" rx="10" class="box" style="stroke:var(--fail,#c9581a)"/>
<text x="910" y="320" class="redt">Agent token, direct to router</text>
<text x="910" y="338" class="s">contact fields → null +</text>
<text x="910" y="354" class="c">UNAUTHORIZED_FIELD_OR_TYPE</text>
<text x="910" y="378" class="redt">apply refused, no ads call</text>

<!-- baselines lane -->
<rect x="14" y="410" width="1092" height="110" rx="10" class="zone"/><text x="76" y="430" class="zt">BASELINES, SAME TASK, NO GRAPH</text>
<rect x="200" y="444" width="230" height="62" rx="8" class="box"/><text x="212" y="466" class="t">Path A · 7 endpoint tools</text><text x="212" y="484" class="c">baseline/rest_mcp.py</text><text x="212" y="500" class="s">full JSON; PII reaches the model</text>
<rect x="460" y="444" width="236" height="62" rx="8" class="box"/><text x="472" y="466" class="t">Path A′ · 3 hand-built tools</text><text x="472" y="484" class="c">baseline/purpose_mcp.py</text><text x="472" y="500" class="s">joins and filters in Python</text>
<path d="M60 156 L60 475 L196 475" class="base" marker-end="url(#mg)"/>
<path d="M430 475 L456 475" class="base" marker-end="url(#mg)"/>
<path d="M696 475 L1112 475 L1112 194 L1096 194" class="base" marker-end="url(#mg)"/>
<text x="716" y="468" class="s">REST calls go straight to the services</text>

<!-- CI lane -->
<rect x="14" y="540" width="1092" height="84" rx="10" class="zone"/><text x="26" y="560" class="zt">CI · GITHUB ACTIONS · scripts/ci.sh (no GraphOS key)</text>
<rect x="40" y="572" width="200" height="40" rx="8" class="box"/><text x="52" y="597" class="c">rover supergraph compose</text>
<rect x="270" y="572" width="230" height="40" rx="8" class="box"/><text x="282" y="597" class="c">check_operations.py (agent ops)</text>
<rect x="530" y="572" width="120" height="40" rx="8" class="box"/><text x="542" y="597" class="c">pytest</text>
<rect x="680" y="572" width="410" height="40" rx="8" class="box"/><text x="692" y="590" class="c">break_field.sh: rename composes,</text><text x="692" y="606" class="c">check fails on CampaignPerformance</text>
<path d="M240 592 L266 592 M500 592 L526 592 M650 592 L676 592" class="cfg" marker-end="url(#mk)"/>
</svg>
